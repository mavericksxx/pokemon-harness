name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "demo/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "demo/**"
      - "*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx electron-builder --mac --dir
