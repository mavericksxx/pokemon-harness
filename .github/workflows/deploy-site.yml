name: Deploy site

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      # site/public/demo.html is generated by tools/demo/build.py from the
      # template plus the real app's CSS, fonts, map and dex data. Editing any
      # of those changes the demo, so they have to trigger a deploy too --
      # otherwise the app's UI moves on and the marketing demo silently keeps
      # rendering an older version of it.
      - "tools/demo/**"
      - "src/renderer/src/index.css"
      - "src/renderer/src/design/fonts.css"
      - "src/renderer/src/assets/fonts/**"
      - "src/renderer/src/scene/garden/maps/garden.tmj"
      - "assets/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Regenerate the demo rather than trusting the committed copy. It has
      # gone stale twice by being a build artifact someone has to remember to
      # rebuild by hand; deploying from a fresh build makes that impossible.
      - name: Regenerate demo.html from its template
        working-directory: .
        run: python3 tools/demo/build.py

      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
