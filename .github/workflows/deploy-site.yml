name: Deploy site

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      # The hero showreel imports the app's real garden modules straight out
      # of src/ (see site/astro.config.mjs), plus the map/dex/sprite assets
      # they load — editing any of those changes what the site ships.
      - "src/renderer/src/**"
      - "src/shared/**"
      - "assets/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
