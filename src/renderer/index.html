<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob:"
    />
    <title>Pokemon Harness</title>
    <!--
      Boot iris wipe (Phase 8 §8) — inlined here, not index.css, so it paints
      on the FIRST frame with zero flash-of-unstyled-content: index.css loads
      as a bundled asset alongside the JS module below, which can lag a beat
      behind first paint; this can't, since it's parsed with the rest of
      <head>. The markup below (#boot-wipe, .boot-pokeball) is duplicated
      verbatim by BootWipe.tsx once React mounts — see that file's header for
      why the duplication is deliberate (a seamless handoff, not a redraw).
    -->
    <style>
      /* Registered so the browser knows `--boot-r` is a percentage (an
       * interpolable, non-inherited value) — without this, `transition` on a
       * plain custom property doesn't know HOW to animate it and just snaps. */
      @property --boot-r {
        syntax: '<percentage>';
        inherits: false;
        initial-value: 0%;
      }
      #boot-wipe {
        position: fixed;
        inset: 0;
        z-index: 100000;
        background: #0d150e;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        --boot-r: 0%;
        -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent var(--boot-r), black calc(var(--boot-r) + 1%));
        mask-image: radial-gradient(circle at 50% 50%, transparent var(--boot-r), black calc(var(--boot-r) + 1%));
        transition: --boot-r 650ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #boot-wipe.boot-wipe-open {
        --boot-r: 150%;
      }
      .boot-pokeball {
        position: relative;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: #f4f4f0;
        border: 4px solid #1a1320;
        overflow: hidden;
        animation: boot-pokeball-wobble 0.8s ease-in-out infinite;
      }
      .boot-pokeball::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 50%;
        background: #e3350d;
      }
      .boot-pokeball::after {
        content: '';
        position: absolute;
        top: calc(50% - 3px);
        left: 0;
        right: 0;
        height: 6px;
        background: #1a1320;
      }
      .boot-pokeball-btn {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 16px;
        height: 16px;
        margin: -8px 0 0 -8px;
        border-radius: 50%;
        background: #f4f4f0;
        border: 3px solid #1a1320;
        z-index: 2;
      }
      @keyframes boot-pokeball-wobble {
        0%,
        100% {
          transform: rotate(-8deg);
        }
        50% {
          transform: rotate(8deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-wipe">
        <div class="boot-pokeball">
          <div class="boot-pokeball-btn"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
